{# templates/shop/partials/_discount_badge.html #}
{% if original_price and original_price > price %}
  {% widthratio original_price price 100 as ratio %}
  {% with discount=ratio|add:"-100"|floatformat:0 %}
    <div class="inline-block bg-brand-maroon text-white px-2 py-[2px] text-[13px] md:text-[14px] font-semibold leading-none rounded-sm whitespace-nowrap">
      <span>-{{ discount }}%</span>
      <span class="ml-2">{{ price }} €</span>
    </div>
  {% endwith %}
{% endif %}
